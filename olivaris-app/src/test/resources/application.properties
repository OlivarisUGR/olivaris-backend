spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# It is necessary to give allow the use of flyway on test database
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

confirmation-token.expiration-hours=24

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=testpassword
spring.mail.urlConfirm=http://localhost:8080/api/auth/confirm?token=
spring.mail.urlConfirmAdmin=http://localhost:8080/api/auth/confirmEntityAdmin?token=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

security.jwt.token.expiration=3600000
